<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Operativo — Mercadona Online</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f8f6;
  --surface: #ffffff;
  --surface2: #f2f2f0;
  --border: rgba(0,0,0,0.1);
  --border-strong: rgba(0,0,0,0.22);
  --text: #1a1a18;
  --text-muted: #6b6b66;
  --text-faint: #a0a09a;
  --teal: #1D9E75;
  --teal-light: #E1F5EE;
  --teal-border: #9FE1CB;
  --teal-dark: #0F6E56;
  --blue: #378ADD;
  --blue-light: #E6F1FB;
  --blue-border: #B5D4F4;
  --blue-dark: #185FA5;
  --m2-bg: #fffef5; --m2-border: #e8e0a0; --m2-text: #6b5e00;
  --m1-bg: #f5f8ff; --m1-border: #b5c8f4; --m1-text: #185FA5;
  --radius: 8px; --radius-lg: 12px;
  --panel-w: 420px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --surface: #242422; --surface2: #2e2e2b;
    --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.22);
    --text: #f0f0ec; --text-muted: #9a9a94; --text-faint: #666660;
    --teal-light: #04342C; --teal-border: #085041; --teal-dark: #5DCAA5;
    --blue-light: #042C53; --blue-border: #0C447C; --blue-dark: #85B7EB;
    --m2-bg: #2a2700; --m2-border: #5a5000; --m2-text: #d4c040;
    --m1-bg: #001a3a; --m1-border: #0C447C; --m1-text: #85B7EB;
  }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Layout ── */
.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 1.5rem 3rem;
  transition: padding-right .3s;
}
.page.panel-open { padding-right: calc(var(--panel-w) + 2rem); }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}
.page-header h1 {
  font-size: 20px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.page-header h1 i { font-size: 20px; color: var(--teal); }
.page-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.hint {
  font-size: 12px; color: var(--text-faint);
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 6px 12px;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}

/* ── Timeline ── */
.timeline-wrap { overflow-x: auto; padding-bottom: 8px; }
.timeline { min-width: 980px; display: flex; flex-direction: column; }

.weeks-row {
  display: grid;
  grid-template-columns: 130px repeat(5,1fr) 1px repeat(3,1fr);
  gap: 6px; margin-bottom: 8px; align-items: stretch;
}
.label-spacer { background: transparent; }
.week-cell {
  text-align: center; padding: 7px 6px;
  border-radius: var(--radius); font-size: 11px; font-weight: 600;
  border: 0.5px solid var(--border);
}
.week-cell .fase-tag { font-size: 10px; font-weight: 400; opacity:.75; display:block; margin-top:1px; }
.week-cell.m2 { background:var(--m2-bg); color:var(--m2-text); border-color:var(--m2-border); }
.week-cell.m1 { background:var(--m1-bg); color:var(--m1-text); border-color:var(--m1-border); }
.week-cell.current { background:var(--teal) !important; color:#fff !important; border-color:var(--teal-dark) !important; box-shadow:0 0 0 3px rgba(29,158,117,.2); }
.week-cell.current .fase-tag { opacity:.85; }
.divider-head { background: var(--border-strong); width:1px; align-self:stretch; }

.phase-legend { display:flex; gap:12px; margin-bottom:14px; margin-left:136px; }
.phase-pill {
  font-size:11px; padding:3px 10px; border-radius:20px; border:0.5px solid; font-weight:500;
}
.phase-pill.m2 { background:var(--m2-bg); color:var(--m2-text); border-color:var(--m2-border); }
.phase-pill.m1 { background:var(--m1-bg); color:var(--m1-text); border-color:var(--m1-border); }

.area-row {
  display: grid;
  grid-template-columns: 130px repeat(5,1fr) 1px repeat(3,1fr);
  gap: 6px; margin-bottom: 10px; align-items: start;
}
.area-divider { background:var(--border); width:1px; align-self:stretch; }
.area-label { display:flex; flex-direction:column; gap:4px; padding-top:6px; padding-right:8px; }
.area-dot-label { display:flex; align-items:center; gap:7px; }
.area-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:1px; }
.dot-teal { background:var(--teal); }
.dot-blue { background:var(--blue); }
.area-name { font-size:12px; font-weight:600; line-height:1.3; }
.cell-empty { min-height:44px; }
.sep-row { height:1px; background:var(--border); margin:8px 0 14px; }

/* ── Task card ── */
.task-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 9px 10px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color .15s, background .12s;
  user-select: none;
}
.task-card:last-child { margin-bottom: 0; }
.task-card:hover { border-color: var(--border-strong); background: var(--surface2); }
.task-card.active { border-color: var(--border-strong); background: var(--surface2); }
.task-card.teal { border-left: 3px solid var(--teal); }
.task-card.blue { border-left: 3px solid var(--blue); }

.task-title {
  font-size: 12px; font-weight: 500; line-height: 1.35;
  display: flex; align-items: flex-start; gap: 5px;
  margin-bottom: 5px;
}
.task-title i { font-size: 13px; margin-top:1px; flex-shrink:0; color:var(--text-muted); }

.card-meta {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.card-badge {
  font-size: 10px; padding: 1px 6px;
  border-radius: 4px; border: 0.5px solid var(--border);
  color: var(--text-faint); background: var(--surface2);
  display: inline-flex; align-items: center; gap: 3px;
}
.card-badge i { font-size: 11px; }
.card-badge.has-steps { color: var(--teal-dark); border-color: var(--teal-border); background: var(--teal-light); }
.card-badge.has-links { color: var(--blue-dark); border-color: var(--blue-border); background: var(--blue-light); }

/* ── Side panel ── */
.panel-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.15);
  z-index: 100;
}
.panel-overlay.open { display: block; }

.side-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--panel-w);
  background: var(--surface);
  border-left: 0.5px solid var(--border-strong);
  z-index: 101;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.side-panel.open { transform: translateX(0); }

.panel-header {
  padding: 16px 18px 14px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px;
  flex-shrink: 0;
}
.panel-color-bar {
  width: 4px; border-radius: 2px; align-self: stretch; flex-shrink: 0;
}
.panel-color-bar.teal { background: var(--teal); }
.panel-color-bar.blue { background: var(--blue); }
.panel-header-text { flex: 1; min-width: 0; }
.panel-header-text h2 { font-size: 15px; font-weight: 600; line-height: 1.3; }
.panel-header-text .panel-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.panel-close {
  background: transparent; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 20px; padding: 2px;
  display: flex; align-items: center; flex-shrink: 0;
  border-radius: 6px; transition: background .12s;
}
.panel-close:hover { background: var(--surface2); }

.panel-body {
  flex: 1; overflow-y: auto; padding: 18px;
  display: flex; flex-direction: column; gap: 20px;
}

/* Section inside panel */
.psec-label {
  font-size: 11px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-faint);
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.psec-label i { font-size: 14px; }

/* Steps */
.steps-list { display: flex; flex-direction: column; gap: 5px; }
.step-row {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--surface2); border-radius: var(--radius);
  padding: 6px 8px; border: 0.5px solid var(--border);
}
.step-num {
  font-size: 10px; font-weight: 600; color: var(--text-faint);
  min-width: 16px; text-align: right; padding-top: 2px;
}
.step-text {
  flex: 1; font-size: 13px; color: var(--text);
  background: transparent; border: none; outline: none;
  font-family: inherit; resize: none;
  min-height: 20px; line-height: 1.45;
  overflow: hidden;
}
.step-del {
  background: transparent; border: none; cursor: pointer;
  color: var(--text-faint); font-size: 16px; padding: 1px 2px;
  border-radius: 4px; transition: color .12s, background .12s;
  display: flex; align-items: center; flex-shrink: 0;
  margin-top: 1px;
}
.step-del:hover { color: #cc3333; background: #fff0f0; }

.reorder-col {
  display: flex; align-items: center; flex-shrink: 0;
  margin-top: 1px; cursor: grab; color: var(--text-faint);
  touch-action: none;
}
.reorder-col:active { cursor: grabbing; }
.reorder-col i { font-size: 15px; }

.step-row, .link-row-panel { transition: transform .12s, opacity .12s; }
.step-row.dragging, .link-row-panel.dragging { opacity: .35; }
.step-row.drag-over-top, .link-row-panel.drag-over-top { box-shadow: inset 0 2px 0 0 var(--teal); }
.step-row.drag-over-bottom, .link-row-panel.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--teal); }

.btn-add-step {
  font-size: 12px; padding: 5px 10px;
  border: 0.5px dashed var(--border-strong);
  border-radius: var(--radius); background: transparent;
  color: var(--text-muted); cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 5px;
  transition: background .12s, border-color .12s;
  width: 100%;
}
.btn-add-step:hover { background: var(--surface2); border-color: var(--teal); color: var(--teal-dark); }

/* Links */
.links-list { display: flex; flex-direction: column; gap: 5px; }
.link-row-panel {
  display: flex; align-items: center; gap: 6px;
}
.link-name-inp {
  width: 110px; flex-shrink: 0;
  font-size: 12px; padding: 5px 8px;
  border: 0.5px solid var(--border-strong);
  border-radius: 6px; background: var(--surface);
  color: var(--text); font-family: inherit; outline: none;
}
.link-name-inp:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(55,138,221,.15); }
.link-url-inp {
  flex: 1; min-width: 0;
  font-size: 12px; padding: 5px 8px;
  border: 0.5px solid var(--border-strong);
  border-radius: 6px; background: var(--surface);
  color: var(--text); font-family: inherit; outline: none;
}
.link-url-inp:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(55,138,221,.15); }
.link-go {
  background: transparent; border: 0.5px solid var(--blue-border);
  color: var(--blue-dark); border-radius: 6px; cursor: pointer;
  font-size: 16px; padding: 4px 6px; display: flex; align-items: center;
  transition: background .12s; flex-shrink: 0;
  text-decoration: none;
}
.link-go:hover { background: var(--blue-light); }
.link-go.disabled { opacity: .3; pointer-events: none; }
.link-del-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--text-faint); font-size: 16px; padding: 3px 4px;
  border-radius: 4px; display: flex; align-items: center; flex-shrink: 0;
  transition: color .12s, background .12s;
}
.link-del-btn:hover { color: #cc3333; background: #fff0f0; }

.btn-add-link {
  font-size: 12px; padding: 5px 10px;
  border: 0.5px dashed var(--border-strong);
  border-radius: var(--radius); background: transparent;
  color: var(--text-muted); cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 5px;
  transition: background .12s, border-color .12s;
  width: 100%;
}
.btn-add-link:hover { background: var(--surface2); border-color: var(--blue); color: var(--blue-dark); }

/* Panel footer */
.panel-footer {
  padding: 12px 18px;
  border-top: 0.5px solid var(--border);
  display: flex; gap: 8px; flex-shrink: 0;
}
.btn-save-panel {
  flex: 1; padding: 8px;
  background: var(--teal); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity .12s;
}
.btn-save-panel:hover { opacity: .88; }
.btn-save-panel.blue-area { background: var(--blue); }
.btn-cancel-panel {
  padding: 8px 14px;
  background: transparent; border: 0.5px solid var(--border-strong);
  border-radius: var(--radius); font-size: 13px;
  color: var(--text-muted); cursor: pointer; font-family: inherit;
  transition: background .12s;
}
.btn-cancel-panel:hover { background: var(--surface2); }

/* Toast */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--surface);
  font-size: 13px; padding: 8px 16px; border-radius: 20px;
  opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none; z-index: 200; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Shared btn base */
.btn {
  font-size: 11px; padding: 3px 9px; border-radius: 6px;
  border: 0.5px solid var(--border-strong);
  background: transparent; color: var(--text-muted);
  cursor: pointer; font-family: inherit;
  transition: background .12s;
  display: inline-flex; align-items: center; gap: 4px;
  text-decoration: none; line-height: 1.4;
}
.btn:hover { background: var(--surface2); }
.btn i { font-size: 12px; }

/* Task modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: 110;
}
.modal-overlay.open { display: block; }
.task-modal {
  display: none;
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 0.5px solid var(--border-strong);
  width: 340px; max-width: 90vw;
  padding: 18px; z-index: 111;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.task-modal.open { display: block; }
.task-modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.task-modal label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text-muted); margin: 10px 0 4px;
  text-transform: uppercase; letter-spacing: .03em;
}
.task-modal select, .task-modal input {
  width: 100%; font-size: 13px; padding: 7px 9px;
  border: 0.5px solid var(--border-strong); border-radius: 6px;
  background: var(--surface); color: var(--text); font-family: inherit;
}
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn-save-panel { flex: 1; }

/* Tabs */
.btn.active { background: var(--teal); color: #fff; border-color: var(--teal-dark); }
.btn.active:hover { background: var(--teal); opacity: .92; }

/* Task done check */
.task-check {
  color: var(--text-faint); cursor: pointer; padding: 2px;
  border-radius: 4px; flex-shrink: 0; display: flex; align-items: center;
}
.task-check:hover { background: var(--surface2); }
.task-check i { font-size: 17px; }
.task-card.done { opacity: .55; }
.task-card.done .task-title { text-decoration: line-through; }

/* Puntual view */
.eventual-cards { display: flex; flex-wrap: wrap; gap: 8px; }
.eventual-cards .task-card { width: 220px; margin-bottom: 0; }
.eventual-empty { font-size: 12px; color: var(--text-faint); padding: 8px 0; }
</style>
</head>
<body>

<div class="page" id="page">
  <div class="page-header">
    <div>
      <h1><i class="ti ti-layout-columns"></i>Planning operativo — Mercadona Online</h1>
      <p>Haz clic en cualquier tarea para ver el detalle, añadir pasos y gestionar enlaces</p>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <div class="hint"><i class="ti ti-click"></i>Clic en tarea para abrir detalle</div>
      <div class="hint" id="sync-badge"><i class="ti ti-loader"></i><span id="sync-text">Iniciando…</span></div>
      <button class="btn" onclick="openTaskModal()" title="Añadir una tarea nueva a Gestión Centros u Oferta"><i class="ti ti-plus"></i>Nueva tarea</button>
      <button class="btn" id="btn-sync-now" onclick="syncToJsonBin()" title="Forzar sincronización manual (solo necesario para quien mantiene los datos)"><i class="ti ti-cloud-upload"></i>Sincronizar</button>
    </div>
  </div>

  <div class="phase-legend" style="margin-bottom:0;">
    <span class="phase-pill m2">◀ M-2 · 5 semanas</span>
    <span class="phase-pill m1">M-1 · 3 semanas ▶</span>
  </div>

  <div style="display:flex; gap:8px; margin:14px 0 18px;">
    <button class="btn active" id="tab-rutinario" onclick="switchView('rutinario')"><i class="ti ti-calendar-week"></i>Rutinario</button>
    <button class="btn" id="tab-puntual" onclick="switchView('puntual')"><i class="ti ti-list-details"></i>Puntual</button>
  </div>

  <div id="view-rutinario">
    <div class="timeline-wrap">
      <div class="timeline" id="app"></div>
    </div>
  </div>

  <div id="view-puntual" style="display:none;">
    <div id="eventual-app"></div>
  </div>
</div>

<!-- Side panel -->
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>

<div class="side-panel" id="panel">
  <div class="panel-header">
    <div class="panel-color-bar" id="panel-bar"></div>
    <div class="panel-header-text">
      <h2 id="panel-title"></h2>
      <div class="panel-meta" id="panel-meta"></div>
    </div>
    <button class="panel-close" onclick="closePanel()" aria-label="Cerrar"><i class="ti ti-x"></i></button>
  </div>

  <div class="panel-body">

    <!-- Steps section -->
    <div>
      <div class="psec-label"><i class="ti ti-list-check"></i>Pasos</div>
      <div class="steps-list" id="steps-list"></div>
      <button class="btn-add-step" onclick="addStep()">
        <i class="ti ti-plus"></i>Añadir paso
      </button>
    </div>

    <!-- Links section -->
    <div>
      <div class="psec-label"><i class="ti ti-link"></i>Enlaces</div>
      <div class="links-list" id="links-list"></div>
      <button class="btn-add-link" onclick="addLink()">
        <i class="ti ti-plus"></i>Añadir enlace
      </button>
    </div>

  </div>

  <div class="panel-footer">
    <button class="btn-save-panel" id="btn-save-panel" onclick="savePanel()">
      <i class="ti ti-check"></i>Guardar
    </button>
    <button class="btn-cancel-panel" onclick="closePanel()">Cancelar</button>
    <button class="btn-cancel-panel" id="btn-delete-task" onclick="deleteTask()" style="display:none; color:#cc3333; border-color:#cc3333;">Eliminar</button>
  </div>
</div>

<!-- Task modal -->
<div class="modal-overlay" id="task-modal-overlay" onclick="closeTaskModal()"></div>
<div class="task-modal" id="task-modal">
  <h3>Nueva tarea</h3>
  <label for="tm-type">Tipo</label>
  <select id="tm-type" onchange="onTaskTypeChange()">
    <option value="rutinaria">Rutinaria (semanal)</option>
    <option value="puntual">Puntual</option>
  </select>
  <label for="tm-area">Grupo</label>
  <select id="tm-area">
    <option value="centros">Gestión Centros</option>
    <option value="oferta">Gestión Oferta</option>
  </select>
  <div id="tm-week-wrap">
    <label for="tm-week">Semana</label>
    <select id="tm-week"></select>
  </div>
  <label for="tm-title">Título</label>
  <input id="tm-title" type="text" placeholder="Nombre de la tarea">
  <label for="tm-icon">Icono (opcional)</label>
  <input id="tm-icon" type="text" placeholder="ti-flag — por defecto ti-list">
  <div class="modal-actions">
    <button class="btn-save-panel" onclick="createTask()"><i class="ti ti-check"></i>Crear</button>
    <button class="btn-cancel-panel" onclick="closeTaskModal()">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WEEKS = [
  {key:'s1m2',label:'Sem 1',fase:'M-2',cls:'m2', mOffset:-2, weekIdx:0},
  {key:'s2m2',label:'Sem 2',fase:'M-2',cls:'m2', mOffset:-2, weekIdx:1},
  {key:'s3m2',label:'Sem 3',fase:'M-2',cls:'m2', mOffset:-2, weekIdx:2},
  {key:'s4m2',label:'Sem 4',fase:'M-2',cls:'m2', mOffset:-2, weekIdx:3},

// Returns the Nth monday (0-based) of a given year+month
function nthMonday(year, month, n) {
  const d = new Date(year, month, 1);
  const dow = d.getDay(); // 0=sun,1=mon...
  const daysToMon = dow === 1 ? 0 : (8 - dow) % 7;
  d.setDate(1 + daysToMon + n * 7);
  return d;
}

// Returns set of week-keys that should be highlighted right now
// Logic: for each "active cycle" (month objectives currently in planning),
// find which planning week contains today and return its key.
// Active cycles: any month M where M-2 or M-1 overlaps with current date.
function getActiveWeekKeys() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const active = new Set();

  // Check cycles for target months: current-1, current, current+1, current+2
  // (covers all possible overlaps)
  for (let delta = -1; delta <= 3; delta++) {
    const targetDate = new Date(today.getFullYear(), today.getMonth() + delta, 1);
    const tYear = targetDate.getFullYear();
    const tMonth = targetDate.getMonth(); // 0-based

    WEEKS.forEach(w => {
      const refMonth = (tMonth + w.mOffset + 12) % 12;
      const refYear = tYear + Math.floor((tMonth + w.mOffset) / 12) +
                      (tMonth + w.mOffset < 0 ? 1 : 0) +
                      (tMonth + w.mOffset < -12 ? 1 : 0);

      // Correct year calculation
      const absMonth = tMonth + w.mOffset;
      const corrYear = tYear + Math.floor(absMonth / 12) - (absMonth < 0 && absMonth % 12 !== 0 ? 0 : 0);
      // Simpler: just use Date arithmetic
      const refDate = new Date(tYear, tMonth + w.mOffset, 1);
      const rY = refDate.getFullYear();
      const rM = refDate.getMonth();

      const mondays = [];
      for (let i = 0; i < 6; i++) {
        const m = nthMonday(rY, rM, i);
        if (m.getMonth() === rM) mondays.push(m);
      }

      if (w.weekIdx >= mondays.length) return;
      const weekStart = mondays[w.weekIdx];
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);

      if (today >= weekStart && today <= weekEnd) {
        active.add(w.key);
      }
    });
  }
  return active;
}

function rebuildAreas() {
  AREAS = BASE_AREAS.map(a => ({
    ...a,
    tasks: Object.fromEntries(Object.entries(a.tasks).map(([k,v]) => [k, v.map(t => ({...t}))]))
  }));

    if (!area) return;
    if (!area.tasks[ct.weekKey]) area.tasks[ct.weekKey] = [];
    const w = WEEKS.find(w => w.key === ct.weekKey);
    area.tasks[ct.weekKey].push({
      id: ct.id,
      title: ct.title,
      icon: ct.icon || 'ti-list',
      week: w ? `${w.label} · ${w.fase}` : '',
      custom: true
    });
  });

  TASK_MAP = {};
  AREAS.forEach(a => {
    Object.values(a.tasks).forEach(arr => arr.forEach(t => {
      TASK_MAP[t.id] = { ...t, areaColor: a.color, areaLabel: a.label.replace('\n',' ') };
    }));
  });

  (EVENTUAL_TASKS || []).forEach(et => {
    const area = AREAS.find(a => a.id === et.areaId);

    TASK_MAP[et.id] = {
      id: et.id,

      areaColor: area.color,
      areaLabel: area.label.replace('\n',' '),
      custom: true,
      eventual: true,
      done: !!et.done
    };
  });
}

// como el nuevo ({data:{...}, customTasks:[...], eventualTasks:[...]}) —

function normalizePayload(raw) {
  if (raw && typeof raw === 'object' && ('data' in raw || 'customTasks' in raw || 'eventualTasks' in raw)) {
    return { data: raw.data || {}, customTasks: raw.customTasks || [], eventualTasks: raw.eventualTasks || [] };

}

function isTaskDoneNow(taskId, weekKey) {
  const d = getTaskData(taskId);
  if (!d.doneWeekStart) return false;
  const w = WEEKS.find(x => x.key === weekKey);
  if (!w) return false;
  const cur = getSlotWeekStart(w);
  if (!cur) return false;
  return d.doneWeekStart === cur.toISOString().slice(0,10);
}

function toggleRoutineDone(taskId, weekKey, ev) {
  ev.stopPropagation();
  const w = WEEKS.find(x => x.key === weekKey);
  const cur = w ? getSlotWeekStart(w) : null;
  const key = cur ? cur.toISOString().slice(0,10) : null;
  const d = DATA[taskId] || { steps: [], links: [] };
  const wasDone = key && d.doneWeekStart === key;
  d.doneWeekStart = (wasDone || !key) ? null : key;
  DATA[taskId] = d;
  cachePayload();
  renderCurrentView();
  syncToJsonBin();
}

  ev.stopPropagation();

  syncToJsonBin();
}

// Devuelve el lunes de inicio de la ocurrencia actual de este slot de semana
// (misma ventana -7..60 días que se usa para la etiqueta de fecha), o null
// si esa ocurrencia no cae cerca de hoy.
function getSlotWeekStart(w) {
  const today = new Date();
  for (let delta = -1; delta <= 3; delta++) {
    const refDate = new Date(today.getFullYear(), today.getMonth() + delta + w.mOffset, 1);
    const rY = refDate.getFullYear();
    const rM = refDate.getMonth();
    const mondays = [];
    for (let i = 0; i < 6; i++) {
      const m = nthMonday(rY, rM, i);
      if (m.getMonth() === rM) mondays.push(m);
    }
    if (w.weekIdx >= mondays.length) continue;
    const weekStart = mondays[w.weekIdx];
    const diffDays = Math.round((weekStart - today) / 86400000);
    if (diffDays >= -7 && diffDays <= 60) return weekStart;
  }
  return null;
}

// Returns "2 jun" style short date range for a week slot, for current cycle
function getWeekDateRange(w) {
  const start = getSlotWeekStart(w);
  if (!start) return null;
  const fmt = d => `${d.getDate()} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]}`;
  return fmt(start);
}

    </div>${sep}`;
  }).join('');
  wrap.innerHTML = html;
}

// ── Panel ────────────────────────────────────────────────────────

function openPanel(id) {
  const task = TASK_MAP[id];
  if (!task) return;
  activeId = id;

  const d = getTaskData(id);
  panelSteps = [...(d.steps || [])];
  panelLinks = (d.links || []).map(l => ({ ...l }));

  // Header
  document.getElementById('panel-title').textContent = task.title;
  document.getElementById('panel-meta').textContent = task.areaLabel + ' · ' + task.week;
  const bar = document.getElementById('panel-bar');
  bar.className = 'panel-color-bar ' + task.areaColor;
  const saveBtn = document.getElementById('btn-save-panel');
  saveBtn.className = 'btn-save-panel' + (task.areaColor === 'blue' ? ' blue-area' : '');
  document.getElementById('btn-delete-task').style.display = task.custom ? 'inline-flex' : 'none';

  renderPanelSteps();
  renderPanelLinks();

  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  document.getElementById('page').classList.add('panel-open');
  renderCurrentView();
}

function closePanel() {
  activeId = null;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  document.getElementById('page').classList.remove('panel-open');
  renderCurrentView();
}

// ── Steps ────────────────────────────────────────────────────────

function renderPanelSteps() {
  const list = document.getElementById('steps-list');
  if (!panelSteps.length) { list.innerHTML = ''; return; }
  list.innerHTML = panelSteps.map((s,i) => `
    <div class="step-row" id="sr-${i}" draggable="true"
      ondragstart="dragStart(event,'step',${i})"
      ondragover="dragOverRow(event,'step',${i})"
      ondragleave="dragLeaveRow(event)"
      ondrop="dropRow(event,'step',${i})"
      ondragend="dragEnd(event)">
      <div class="reorder-col" title="Arrastrar para reordenar"><i class="ti ti-grip-vertical"></i></div>
      <span class="step-num">${i+1}</span>
      <textarea class="step-text" id="st-${i}" rows="1"
        oninput="syncStep(${i},this)"
        onkeydown="stepKey(event,${i})"
        placeholder="Describe el paso...">${escHtml(s)}</textarea>
      <button class="step-del" onclick="delStep(${i})" title="Eliminar paso"><i class="ti ti-x"></i></button>
    </div>`).join('');
  panelSteps.forEach((_,i) => autoResize(document.getElementById('st-'+i)));
}

function autoResize(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function syncStep(i, el) {
  panelSteps[i] = el.value;
  autoResize(el);
}

function stepKey(e, i) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    panelSteps.splice(i+1, 0, '');
    renderPanelSteps();
    setTimeout(() => {
      const next = document.getElementById('st-'+(i+1));
      if (next) next.focus();
    }, 0);
  }
  if (e.key === 'Backspace' && panelSteps[i] === '' && panelSteps.length > 1) {
    e.preventDefault();
    delStep(i);
    setTimeout(() => {
      const prev = document.getElementById('st-'+Math.max(0,i-1));
      if (prev) { prev.focus(); const len = prev.value.length; prev.setSelectionRange(len,len); }
    }, 0);
  }
}

function addStep() {
  panelSteps.push('');
  renderPanelSteps();
  setTimeout(() => {
    const last = document.getElementById('st-'+(panelSteps.length-1));
    if (last) last.focus();
  }, 0);
}

function delStep(i) {
  panelSteps.splice(i, 1);
  renderPanelSteps();
}

// ── Drag & drop reorder (steps + links) ────────────────────────────

let dragInfo = { type: null, index: null };

function dragStart(e, type, i) {
  dragInfo = { type, index: i };
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(i)); } catch {}
  e.currentTarget.classList.add('dragging');
}

function dragOverRow(e, type, i) {
  if (dragInfo.type !== type) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.currentTarget;
  row.classList.remove('drag-over-top', 'drag-over-bottom');
  if (i === dragInfo.index) return;
  const rect = row.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  row.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
}

function dragLeaveRow(e) {
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
}

function dropRow(e, type, targetIndex) {
  if (dragInfo.type !== type || dragInfo.index === null) return;
  e.preventDefault();
  const row = e.currentTarget;
  const rect = row.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  let insertAt = before ? targetIndex : targetIndex + 1;

  const list = type === 'step' ? panelSteps : panelLinks;
  const from = dragInfo.index;
  if (from === insertAt || from === insertAt - 1) {
    row.classList.remove('drag-over-top', 'drag-over-bottom');
    return;
  }
  const [item] = list.splice(from, 1);
  if (from < insertAt) insertAt--;
  list.splice(insertAt, 0, item);

  if (type === 'step') renderPanelSteps(); else renderPanelLinks();
}

function dragEnd(e) {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el =>
    el.classList.remove('drag-over-top', 'drag-over-bottom'));
  dragInfo = { type: null, index: null };
}

// ── Links ────────────────────────────────────────────────────────

function renderPanelLinks() {
  const list = document.getElementById('links-list');
  if (!panelLinks.length) { list.innerHTML = ''; return; }
  list.innerHTML = panelLinks.map((l,i) => {
    const hasUrl = l.url && l.url.trim();
    return `
      <div class="link-row-panel" id="lr-${i}" draggable="true"
        ondragstart="dragStart(event,'link',${i})"
        ondragover="dragOverRow(event,'link',${i})"
        ondragleave="dragLeaveRow(event)"
        ondrop="dropRow(event,'link',${i})"
        ondragend="dragEnd(event)">
        <div class="reorder-col" title="Arrastrar para reordenar"><i class="ti ti-grip-vertical"></i></div>
        <input class="link-name-inp" id="ln-${i}" placeholder="Nombre" value="${escAttr(l.name||'')}"
          oninput="syncLinkName(${i},this)">
        <input class="link-url-inp" id="lu-${i}" type="url" placeholder="https://…" value="${escAttr(l.url||'')}"
          oninput="syncLinkUrl(${i},this)">
        <a class="link-go${hasUrl?'':' disabled'}" href="${hasUrl?escAttr(l.url):'#'}"
          target="_blank" rel="noopener" title="Abrir enlace" id="lg-${i}">
          <i class="ti ti-external-link"></i>
        </a>
        <button class="link-del-btn" onclick="delLink(${i})" title="Eliminar enlace">
          <i class="ti ti-trash"></i>
        </button>
      </div>`;
  }).join('');
}

function syncLinkName(i,el) { panelLinks[i].name = el.value; }
function syncLinkUrl(i,el) {
  panelLinks[i].url = el.value;
  const go = document.getElementById('lg-'+i);
  if (go) { const v=el.value.trim(); go.href=v||'#'; go.classList.toggle('disabled',!v); }
}
function addLink() {
  panelLinks.push({ name:'', url:'' });
  renderPanelLinks();
  setTimeout(() => {
    const last = document.getElementById('ln-'+(panelLinks.length-1));
    if (last) last.focus();
  }, 0);
}
function delLink(i) { panelLinks.splice(i,1); renderPanelLinks(); }

// ── Sincronización JSONBin ─────────────────────────────────────────

function setSyncStatus(state, text) {
  const badge = document.getElementById('sync-badge');
  const txt = document.getElementById('sync-text');
  if (!badge || !txt) return;
  txt.textContent = text;
  const icons = { loading: 'ti-loader', ok: 'ti-cloud-check', err: 'ti-cloud-off', local: 'ti-device-floppy' };
  const icon = badge.querySelector('i');
  if (icon) icon.className = 'ti ' + (icons[state] || 'ti-cloud');
}

async function initData() {
  if (!JSONBIN_CONFIGURED) {
    setSyncStatus('local', 'Bin no configurado — usando copia local');
    rebuildAreas();
    switchView(currentView);
    return;
  }
  setSyncStatus('loading', 'Cargando datos…');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const norm = normalizePayload(json.record);
    const hasContent = Object.keys(norm.data).length || norm.customTasks.length || norm.eventualTasks.length;
    if (hasContent) {
      DATA = norm.data;
      CUSTOM_TASKS = norm.customTasks;
      EVENTUAL_TASKS = norm.eventualTasks;
      cachePayload();
      setSyncStatus('ok', 'Datos actualizados');
    } else {
      setSyncStatus('local', 'Bin vacío — pulsa "Sincronizar" para subir tu copia');
    }
  } catch (e) {
    setSyncStatus('err', 'Sin conexión — usando última copia local');
  }
  rebuildAreas();
  switchView(currentView);
}

async function syncToJsonBin() {
  if (!JSONBIN_CONFIGURED) {
    showToast('Falta configurar JSONBIN_BIN_ID en el código');
    return;
  }
  setSyncStatus('loading', 'Guardando en la nube…');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
      body: JSON.stringify({ data: DATA, customTasks: CUSTOM_TASKS, eventualTasks: EVENTUAL_TASKS })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('ok', 'Sincronizado ✓');
    showToast('Sincronizado con JSONBin ✓');
  } catch (e) {
    setSyncStatus('err', 'Error al sincronizar');
  }
}

// ── Nueva tarea (formulario) ────────────────────────────────────────

function openTaskModal() {
  const sel = document.getElementById('tm-week');
  sel.innerHTML = WEEKS.map(w => `<option value="${w.key}">${w.fase} · ${w.label}</option>`).join('');
  document.getElementById('tm-type').value = 'rutinaria';
  document.getElementById('tm-area').value = 'centros';
  document.getElementById('tm-title').value = '';
  document.getElementById('tm-icon').value = '';
  onTaskTypeChange();
  document.getElementById('task-modal-overlay').classList.add('open');
  document.getElementById('task-modal').classList.add('open');
}

function onTaskTypeChange() {
  const isPuntual = document.getElementById('tm-type').value === 'puntual';
  document.getElementById('tm-week-wrap').style.display = isPuntual ? 'none' : '';
}

function closeTaskModal() {
  document.getElementById('task-modal-overlay').classList.remove('open');
  document.getElementById('task-modal').classList.remove('open');
}

function createTask() {
  const type = document.getElementById('tm-type').value;
  const areaId = document.getElementById('tm-area').value;
  const title = document.getElementById('tm-title').value.trim();
  const icon = document.getElementById('tm-icon').value.trim() || 'ti-list';
  if (!title) { showToast('Ponle un título a la tarea'); return; }

  const id = 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  if (type === 'puntual') {
    EVENTUAL_TASKS.push({ id, areaId, title, icon, done: false });
  } else {
    const weekKey = document.getElementById('tm-week').value;
    CUSTOM_TASKS.push({ id, areaId, weekKey, title, icon });
  }
  cachePayload();
  closeTaskModal();
  rebuildAreas();
  renderCurrentView();
  showToast('Tarea creada ✓ — sincronizando…');
  syncToJsonBin();
}

function deleteTask() {
  if (!activeId) return;
  if (!confirm('¿Eliminar esta tarea? No se puede deshacer.')) return;
  CUSTOM_TASKS = CUSTOM_TASKS.filter(ct => ct.id !== activeId);
  EVENTUAL_TASKS = EVENTUAL_TASKS.filter(et => et.id !== activeId);
  delete DATA[activeId];
  cachePayload();
  rebuildAreas();
  closePanel();
  showToast('Tarea eliminada ✓ — sincronizando…');
  syncToJsonBin();
}

// ── Save ─────────────────────────────────────────────────────────

function savePanel() {
  if (!activeId) return;
  DATA[activeId] = {
    steps: panelSteps.filter(s => s.trim()),
    links: panelLinks.filter(l => l.url.trim() || l.name.trim())
  };
  cachePayload();
  closePanel();
  showToast('Guardado ✓ — sincronizando…');
  syncToJsonBin();
}

// ── Utils ────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

initData();
</script>
